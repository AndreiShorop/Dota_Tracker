[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dota-tracker"
version = "0.1.0"
description = "Professional desktop analytics application for Dota 2 built with PySide6 and PostgreSQL."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [
  { name = "Dota Tracker Contributors" }
]
keywords = ["dota2", "analytics", "desktop", "pyside6", "postgresql", "sqlalchemy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Topic :: Games/Entertainment",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "pyside6>=6.7",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg2-binary>=2.9",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "pandas>=2.2",
  "numpy>=1.26",
  "matplotlib>=3.9",
  "httpx>=0.27",
  "loguru>=0.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://example.invalid/dota-tracker"
Repository = "https://example.invalid/dota-tracker"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
]
xfail_strict = true
filterwarnings = [
  "error",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "B",
  "UP",
  "SIM",
  "C4",
  "RUF",
]
ignore = []
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["dota_tracker"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
no_implicit_optional = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_reexport = true
strict_equality = true
show_error_codes = true
pretty = true
mypy_path = ["src"]
packages = ["dota_tracker"]

[[tool.mypy.overrides]]
module = [
  "matplotlib.*",
  "pandas.*",
  "yaml.*",
]
ignore_missing_imports = true
